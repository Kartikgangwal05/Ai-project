    <script>
      // Defensive safeguard: Ensure window.fetch has both getter and setter so browser extensions and iframe interceptors do not throw TypeError
      (function () {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _currentFetch;
            },
            set: function (val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // ignore
        }
      })();
    </script>
